# 平台关系注册表（PHASE2_GOLD_FINALIZATION）
#
# Controller 明确要求：
#   「母平台、子产品、同一厂商生态、共享域名，必须是**不同关系类型**」
#   「不得根据品牌名称或域名相似度**猜测**父子关系」
#   「无权威证据的关系标注为 UNVERIFIED」
#
# ⚠️ 自我纠正：上一轮我在 `platform_backfill.yaml` 里写了 7 组 `parent_platform`
#    （cnki_ai→cnki、leappspace→sciencedirect、aizhishu→stats 等），依据是
#    **品牌名与官网路径的相似性**，并没有权威来源。按 Controller 本轮规则，
#    那属于「猜测」，必须改标 UNVERIFIED。其中 `aizhishu → stats` 尤其可疑：
#    它是因为初赛-6 的 Gold 里含 `stats` 才那样写的，属于**向指标凑**，
#    本轮一并纠正为 UNVERIFIED 并进入人工裁决包。
#
# 关系类型（relationship）取值：
#   SAME_PLATFORM       同一平台的不同入口/别名
#   PARENT_PLATFORM     子产品所属的母平台（同一厂商的独立产品入口）
#   PROVIDER            内容的提供方（厂商/机构）
#   ECOSYSTEM           同一厂商生态，但产品相互独立
#   SHARED_DOMAIN       仅共享域名，产品关系不明
#
# 证据等级（evidence_level）：
#   AUTHORITATIVE   有权威来源（官方文档/标准/官网明确的父子声明）
#   CONTROLLER      由 Controller 直接给定
#   NONE            无权威来源 —— 一律 UNVERIFIED，且**不得参与准确率计算**

