version: 1
policy_id: PROVINCIAL_ELIMINATION_COMPLIANCE
generated_at: "2026-10-07"
status: ACTIVE

# ===========================================================================
# 本文件是 P0 规则，优先级高于本仓库中的任何其他配置、脚本默认值、
# 历史 handoff 记录或运行期参数。冲突时一律以本文件为准。
#
# 本文件**只能由人类（Controller）修改**。运行时脚本不得自动改写它。
# ===========================================================================

precedence: P0
overridable: false

role:
  identity: "受选手实时控制的 AI 信息检索与分析执行体"
  not: "自动答题外挂"
  objective: "在规则允许范围内，让选手用尽可能短的时间获得尽可能可靠的信息，再由选手自行判断与作答"

# ---------------------------------------------------------------------------
# 两道 Human Gate：任何时候都不得跨越
# ---------------------------------------------------------------------------
human_gates:
  gate_1_question_ingress:
    statement: "题目进入系统必须来自选手主动提供（人工读取 / 人工复制 / 人工输入）"
    enforcement: "本执行体不接受任何自动捕获的题目输入；缺少选手提供的题干时不得开始检索"
    forbidden_mechanisms:
      - auto_dom_read
      - ocr_screen_watcher
      - screenshot_listener
      - clipboard_watcher
      - competition_api_polling
      - competition_websocket_listen
  gate_2_answer_egress:
    statement: "答案进入比赛系统必须由选手本人判断并手动操作"
    enforcement: "本执行体只输出候选答案、置信度、证据与人工操作指引；不接触比赛作答界面"
    forbidden_mechanisms:
      - auto_select_option
      - auto_fill_answer
      - auto_click_next
      - auto_submit
      - competition_account_control

# ---------------------------------------------------------------------------
# 硬隔离：Competition Surface = Human Only
# ---------------------------------------------------------------------------
competition_surface:
  definition: "比赛平台自身及其同源域/接口。Human Only，禁止任何自动化接触。"
  automation_allowed: false
  dom_read_allowed: false
  devtools_automation_allowed: false
  api_or_xhr_access_allowed: false
  auto_fill_allowed: false
  auto_submit_allowed: false
  ocr_allowed: false
  screenshot_analysis_allowed: false
  clipboard_capture_allowed: false
  known_hosts:
    - csc.xxsuyang.com
    - xxsuyang.com
  host_suffix_patterns:
    - "xxsuyang.com"
  # 无法判断某页面是否属于比赛系统时的默认行为
  unknown_surface_policy:
    action: TREAT_AS_COMPETITION_SURFACE
    then: ASK_CONTROLLER
    note: "宁可把外部页面误判为比赛面（损失速度），也不可把比赛面误判为外部页面（违规）。"

# ---------------------------------------------------------------------------
# 允许自动化的研究面
# ---------------------------------------------------------------------------
research_surface:
  definition: "比赛平台之外的公开信息源。可以由本执行体控制。"
  automation_allowed: true
  allowed_capabilities:
    - ai_llm
    - ai_agent
    - search_engine
    - browser
    - browser_automation_plugin
    - cli_tools
    - public_web_browsing
    - public_database_access
    - external_information_retrieval
    - information_organization_compare_compute
    - candidate_answer_with_evidence
  notes:
    - "自动浏览仅限比赛系统之外的公开网页与公开数据库。"
    - "深链接必须来自已验证配置、官方网站、当前浏览器真实导航或可靠历史配方；不得编造 URL。"
  # 显式确认的公开研究主机。除本表外，compliance_gate 还会自动确认
  # config/platform_entry_status.json 中 source 为 KNOWN_HISTORY / PREFLIGHT 的
  # 主机（即本项目实际实测过的公开站点）。两者都不命中的主机一律按未知面处理：
  # 禁止自动化，先询问 Controller。
  confirmed_hosts:
    - example.com
    - bing.com
    - cn.bing.com
    # 以下主机来自本仓库既有的 config/platforms.yaml 策展表（校赛期已声明为
    # 公开平台），补入本闸门以免默认拒绝策略把合法研究目标一并挡住。
    # 复核记录见 config/research_surface_whitelist_review.md。
    - github.com
    - stats.gov.cn
    - modelscope.cn
    - arxiv.org
    - nppa.gov.cn
    # 收紧：NSFC 主站是 nsfc.gov.cn；这里只需要访问科学基金共享服务网
    # 的 kd.nsfc.cn，因此不做 nsfc.cn 整域放行。
    - kd.nsfc.cn

# ---------------------------------------------------------------------------
# 明令禁止的动作（与 §1 一一对应）
# ---------------------------------------------------------------------------
forbidden_actions:
  - auto_read_competition_dom
  - capture_question_via_playwright_or_selenium_or_devtools
  - capture_question_via_browser_extension
  - listen_or_replay_competition_api
  - auto_pull_question_or_answer_from_competition_api
  - extract_question_via_ocr_or_screenshot_watcher
  - extract_question_via_clipboard_watcher
  - auto_select_option_on_competition_page
  - auto_fill_answer
  - auto_click_next_question
  - auto_submit
  - auto_control_competition_account
  - bypass_captcha
  - bypass_login
  - bypass_login_verification
  - bypass_waf
  - bypass_cloudflare
  - bypass_risk_control
  - any_autonomous_answering_without_live_human_judgement

# ---------------------------------------------------------------------------
# 风控纪律：登录墙 / 验证码 / WAF / Cloudflare 是正常状态，不是异常
# ---------------------------------------------------------------------------
risk_controls:
  bypass_captcha: false
  bypass_waf: false
  bypass_login: false
  bypass_cloudflare: false
  bypass_rate_limit: false
  use_unauthorized_endpoints: false
  bulk_scraping: false
  retry_same_route_max: 1
  max_browser_failures_per_question: 2
  on_login_wall: HUMAN_HANDOFF
  on_captcha: HUMAN_HANDOFF_AT_FIRST_SECOND
  on_cloudflare_or_waf: HUMAN_HANDOFF_OR_FALLBACK
  on_risk_control_signal: STOP_RETRYING
  credential_handling:
    read_or_store_password: false
    read_or_export_cookie: false
    read_or_export_token: false
    note: "需要认证时交给选手本人；本执行体不接触任何凭证。"

# ---------------------------------------------------------------------------
# 外部公开接口使用边界
# ---------------------------------------------------------------------------
external_api_policy:
  competition_api_access: false
  public_site_normal_ui_preferred: true
  public_site_own_xhr_allowed_when:
    - no_auth_bypass
    - no_captcha_bypass
    - no_rate_limit_evasion
    - no_unauthorized_endpoint
    - no_bulk_scraping
    - source_url_recorded
  fallback_when_uncertain: RETURN_TO_MANUAL_WEB_PATH
  prefer_for_live_competition: "可解释、可复现、录屏中容易理解的浏览器操作路径"

# ---------------------------------------------------------------------------
# 证据分级（禁止把旁证写成官方）
# ---------------------------------------------------------------------------
evidence_policy:
  levels:
    VERIFIED_PRIMARY:
      label: "🟢 官方来源 / 题目指定数据库 / 原始页面实测"
      upgrade_requires: "新的官方页面实测，或官方原始文件"
    VERIFIED_MULTI:
      label: "🟢 两个高质量独立来源一致"
      upgrade_requires: "第二个独立高质量来源"
    SECONDARY:
      label: "🟠 旁证：第三方 / 聚合库 / Crossref / 搜索摘要"
      upgrade_requires: "来自官方源的独立确认"
    MODEL_REASONING:
      label: "🟡 模型知识 / 规则推理 / 排除法"
      upgrade_requires: "任何外部证据"
    HUMAN_REQUIRED:
      label: "🔴 必须人工：登录 / 验证码 / 桌面软件 / 无法访问"
      upgrade_requires: "选手回传的人工核验结果"
  rules:
    - "禁止把 SECONDARY 写成 VERIFIED_PRIMARY。"
    - "禁止因为答案看起来合理而升级证据等级。"
    - "搜索摘要不得作为最终证据；必须打开原始来源。"
    - "未验证就明确写「未验证」；旁证就是旁证。"

# ---------------------------------------------------------------------------
# 自动化失败与降级纪律
# ---------------------------------------------------------------------------
degradation_policy:
  ladder:
    - EXACT_MATCH
    - VARIANT_RECIPE
    - PLATFORM_RECIPE
    - OFFICIAL_PLATFORM_EXECUTION
    - MANUAL_HANDOFF
    - ZERO_BASE_WEB_RESEARCH
  rules:
    - "不得跳级；上一级失败才降到下一级。"
    - "ZERO_BASE_WEB_RESEARCH 是最低优先级，不得用于变体题。"
    - "同一路线最多 1 次合理重试；判定为风控后立即停止。"
    - "连续自动化失败达到预算后必须转人工，不得无限重试。"

# ---------------------------------------------------------------------------
# 运行期自检：脚本启动时应校验以下不变式
# ---------------------------------------------------------------------------
invariants:
  - id: INV_1
    statement: "比赛面 URL 不得传给任何自动化控制器"
  - id: INV_2
    statement: "变体题的答案字段必须为空"
  - id: INV_3
    statement: "证据等级不得由弱变强，除非有新证据"
  - id: INV_4
    statement: "触发验证码 / 登录墙时立即产出 HUMAN_REQUIRED"
  - id: INV_5
    statement: "同一路线重试次数不得超过 retry_same_route_max"
  - id: INV_6
    statement: "module_id 优先于被污染的 module_name"
  - id: INV_7
    statement: "个人赛阈值 1/3 与团队赛阈值 1/5 不得混用"
