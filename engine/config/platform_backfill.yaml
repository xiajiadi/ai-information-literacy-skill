# 两条纪律（沿用 DECISION 1）：
#   1. **不臆造**。这里只补 `canonical_name` 与 `aliases`（解决"认不出"这个
#      真实缺口）。`domains` 与 `official_entry` **一律留空**，因为我没有
#      权威来源核实其官方域名/入口；留空由合规闸门按默认拒绝处理。
#      待 Controller 核实后再补 domains 与 official_entry。
#   2. 全部标记 `verification_status: UNVERIFIED`、
#      `provenance: AUTHOR_CURATED_PENDING_REVIEW`，不得冒充已核实条目。
#
# 复现：uv run python scripts/phase2_platform_gap.py
#
# `parent_platform` 说明：许多被点名的「平台」其实是某个大平台的**子产品**。
# 实测发现若把它们当独立平台，会**遮蔽**母平台标签（例如「知网研学」遮蔽 `cnki`），
# 使点名题准确率从 86.3% 掉到 72.7%。因此显式记录父子关系，
# 评估时**分别**报告严格命中与同族命中，不把同族命中混进严格口径。

