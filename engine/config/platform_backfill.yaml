# 来源：`data/quality/phase2/platform_gap.json` 的证据驱动缺口分析 ——
# 只收录**在真实题库题干或正式 50 模块导航里实际出现过**、而当前别名索引
# 认不出的平台。不收录凭印象觉得重要的平台。
