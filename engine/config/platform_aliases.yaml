# 平台名称别名 overlay（人工策展）
#
# 为什么需要这个文件：
#   `config/platform_capabilities.json` 由 `build_platform_capabilities.py`
#   自动生成，把**遇到的每个 URL 主机**都当成了一个平台条目，并把主机名
#   直接写进 `name` 字段。实测 128 个条目里有 **105 个的 name 是主机名**
#   （如 `aistudio` 的 name 是 `aistudio.baidu.com`，`nhc` 的 name 是
#   `nhc.gov.cn`）。
#
#   后果：按「题干里出现的平台名」做识别时，82% 的平台根本没有可用名称，
#   只能靠少数几个正常条目。这是 PHASE 2 平台路由准确率偏低的首要原因。
#
# 本文件用**题干里真实会出现的写法**（中文名、英文名、常见简称）映射到
# 已存在的 platform_key，优先级高于自动生成的名字。
#
# 规则：
#   - 只映射到 `platform_capabilities.json` 里**已存在**的 key；
#   - 别名必须是**有区分度**的（避免「百度」这种会同时命中多个平台的词，
#     除非确实要映射到某一个）；
#   - 不在这里编造新平台；缺失的平台记在 `missing_platforms` 里供 Controller 决策。

