# Gold 构建专用产品词典（**与路由器别名表相互独立**）
#
# ⚠️ 为什么需要单独一份：
#   第一版 product-level Gold 直接复用了路由器自己的别名索引
#   （`platform_router_v2.platform_aliases()`）来抽取「题干点名的产品」，
#   而路由器的 `longest_known_alias()` 用的是**同一张表、同一套最长匹配**。
#   结果配对评估里「补录后」得到 200/200 = 100% —— 这是**循环论证**：
#   Gold 与预测由同一机制产生，必然全对。这正是 Controller 禁止的
#   「把自身模型预测当作独立 Gold」。
#
#   本文件是**独立编写**的标注词典：只描述「题干里出现什么字样时，
#   人会把该题判给哪个产品」，与路由器的匹配逻辑、别名表、评分无关。
#   两者由不同来源写成，因此用它构建的 Gold 至少不是同一条代码路径的产物。
#
# 诚实声明：这仍是**作者人工编写**的词典，不是第三方人工标注。
#   `matches` 一栏记录命中了哪些字样，供人工审计；
#   若人工复核推翻某条，只改本文件即可，不影响路由器。
#
# 用法：仅 `scripts/phase2_gold_builder.py` 读取。路由器**不得**引用本文件。

